<!DOCTYPE html>
<html lang="pt‑PT">
<head>
  <meta charset="UTF‑8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabela Estilizada</title>
  <style>
    :root {
      --cor-primaria: #3399ff;
      --cor-secundaria: white;
      --cor-terciaria: #003d7a;
      --cor-cinzento: #6c757d;
      --cor-verde: #198754;
      --cor-vermelho: #dc3545;
      --cor-fundo-linha-par: #f8f9fa;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', 'Open Sans', sans-serif;
      padding: 20px;
      background-color: var(--cor-secundaria);
    }

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 12px 15px;
      border: 1px solid var(--cor-cinzento);
      text-align: left;
    }

    .table thead th {
      background-color: var(--cor-primaria);
      color: var(--cor-secundaria);
    }

    .table tbody tr:nth-child(even) {
      background-color: var(--cor-fundo-linha-par);
    }

    .table-group-divider tr + tr {
      border-top: 2px solid var(--cor-cinzento);
    }

    .table tbody tr:hover {
      background-color: var(--cor-terciaria);
      color: var(--cor-secundaria);
    }
    
    .footer {
      background-color: var(--card-bg);
      padding: 32px;
      font-size: 13px;
      color: var(--texto);
      border-top: 1px solid var(--borda);
      margin-top: 2rem;
    }

    .footer-top {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      align-items: start;
    }

    .footer-logo {
      width: 120px;
      margin-bottom: 1rem;
    }

    .footer-slogan {
      font-size: 12px;
      color: var(--texto);
      opacity: 0.7;
    }

    .footer-links {
      display: flex;
      flex-direction: row;
      gap: 4rem;
    }

    .footer-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .footer-title {
      color: var(--cor-laranja);
    }

    .footer-col a {
      text-decoration: none;
      color: var(--texto);
      opacity: 0.85;
    }

    .footer-col a:hover {
      opacity: 1;
    }

    .footer-bottom {
      max-width: 1200px;
      margin: 2rem auto 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      color: var(--texto);
      opacity: 0.8;
    }

    .footer-link {
      color: var(--cor-terciaria);
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <table class="table">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Primeiro</th>
        <th scope="col">Último</th>
        <th scope="col">Handle</th>
      </tr>
    </thead>
    <tbody class="table-group-divider">
      <tr>
        <th scope="row">1</th>
        <td>Mark</td>
        <td>Otto</td>
        <td>@mdo</td>
      </tr>
      <tr>
        <th scope="row">2</th>
        <td>Jacob</td>
        <td>Thornton</td>
        <td>@fat</td>
      </tr>
      <tr>
        <th scope="row">3</th>
        <td colspan="2">Larry, o Pássaro</td>
        <td>@twitter</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
