<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <style>
            body {
    font-family: 'Segoe UI', 'Roboto', 'Open Sans', sans-serif;
    font-size: 16px;
    
    }
                .footer {
                    background-color: var(--card-bg);
                    padding: 32px;
                    font-size: 13px;
                    color: var(--texto);
                    border-top: 1px solid var(--borda);
                    margin-top: 2rem;
                }

                .footer-top {
                    max-width: 1200px;
                    margin: 0 auto;
                    display: grid;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 2rem;
                    align-items: start;
                }

                .footer-logo {
                    width: 120px;
                    margin-bottom: 1rem;
                }

                .footer-slogan {
                    font-size: 12px;
                    color: var(--texto);
                    opacity: 0.7;
                }

                .footer-links {
                    display: flex;
                    flex-direction: row;
                    gap: 4rem;
                }

                .footer-col {
                    display: flex;
                    flex-direction: column;
                    gap: 6px;
                }

                .footer-title {
                    color: var(--cor-laranja);
                }

                .footer-col a {
                    text-decoration: none;
                    color: var(--texto);
                    opacity: 0.85;
                }

                .footer-col a:hover {
                    opacity: 1;
                }

                .footer-bottom {
                    max-width: 1200px;
                    margin: 2rem auto 0;
                    display: flex;
                    flex-direction: column;
                    gap: 8px;
                    font-size: 12px;
                    color: var(--texto);
                    opacity: 0.8;
                }

                .footer-link {
                    color: var(--cor-terciaria);
                    text-decoration: underline;
                }
        </style>
</body>
</html>
